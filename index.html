<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lista de Torneios</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: #fff;
        margin: 0;
        padding: 20px;
    }

    h1, h2 {
        text-align: center;
    }

    .container {
        max-width: 600px;
        margin: auto;
        background: #1b1b1b;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(255,255,255,0.05);
    }

    .item {
        background: #222;
        padding: 10px;
        margin: 10px 0;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .item label {
        flex: 1;
        margin-left: 10px;
    }

    .stats {
        margin-top: 20px;
        font-size: 18px;
        background: #222;
        padding: 15px;
        border-radius: 8px;
    }

    input[type="checkbox"] {
        transform: scale(1.2);
        cursor: pointer;
    }
</style>
</head>
<body>

<h1>Lista de Torneios</h1>

<div class="container">
    <h2>Campeonatos</h2>

    <div id="lista"></div>

    <div class="stats">
        <p><strong>Bruno falta:</strong> <span id="bruno">6</span> torneios</p>
        <p><strong>Batschauer falta:</strong> <span id="bats">7</span> torneios</p>
    </div>
</div>

<script>
    const campeonatos = [
        "11/12: 14:00 - 17:00 (rank)",
        "12/12: 14:00 - 17:00 (rank)",
        "12/12: 18:00 - 21:00 (skin)",
        "12/12: 18:00 - 21:00 (ranked zb duos)",
        "13/12: 14:00 - 17:00 (rank reload duo)",
        "13/12: 18:00 - 21:00 (skin)",
        "14/12: 14:00 - 17:00 (rank)",
        "15/12: 14:00 - 17:00 (rank)"
    ];

    const container = document.getElementById("lista");

    campeonatos.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "item";

        div.innerHTML = `
            <input type="checkbox" id="chk${index}" onchange="atualizar()">
            <label for="chk${index}">${item}</label>
        `;

        container.appendChild(div);
    });

    function atualizar() {
        const feitos = document.querySelectorAll("input[type='checkbox']:checked").length;

        // Bruno começa com 6
        document.getElementById("bruno").textContent = 6 - feitos;

        // Batschauer começa com 7
        document.getElementById("bats").textContent = 7 - feitos;
    }
</script>

</body>
</html>
